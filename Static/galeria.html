<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Galería estática de Pintofruta con estética inspirada en el home." />
    <title>Pintofruta | Galería</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="maqueta-pages.css">
    <script src="data/site-content-data.js" defer></script>
    <script defer src="auth.js"></script>
    <script defer src="site-content.js"></script>
    <script defer src="maqueta-pages.js"></script>
</head>
<body data-page="gallery">
    <main class="page-shell">
        <header class="topbar">
            <a class="brand" href="index.html">
                <span class="brand-mark">PF</span>
                <span class="brand-copy">
                    <strong>Pintofruta</strong>
                    <span>Galería estática</span>
                </span>
            </a>
            <nav class="top-links">
                <a class="chip-link" href="index.html">Home</a>
                <a class="chip-link" href="busqueda.html">Búsqueda</a>
                <a class="chip-link" href="admin-demo.html">Admin demo</a>
                <a class="chip-link button-primary" href="#pfProductModal" data-open-product-detail="1" data-product-sku="MERA09">Ver detalle</a>
                <a class="chip-link" href="login.html">Ingresar</a>
            </nav>
        </header>

        <section class="section">
            <section class="products-panel">
                <div class="products-head">
                    <div>
                        <span class="eyebrow" data-kicker>Colección / Destacados</span>
                        <h1 id="galleryTitle">Galería</h1>
                        <p id="gallerySubtitleLine">Una selección de tarjetas con precios, marca y acceso directo a la ficha.</p>
                    </div>
                    <div class="gallery-toolbar">
                        <div class="gallery-sort">
                            <span>Ordenar por</span>
                            <select id="gallerySortingOption" name="gallerySortingOption">
                                <option selected="selected" value="Relevancia">Relevancia</option>
                                <option value="MasNuevo">Más Nuevo</option>
                                <option value="MasAntiguo">Más Antiguo</option>
                                <option value="MenorPrecio">Menor Precio</option>
                                <option value="MayorPrecio">Mayor Precio</option>
                                <option value="Descripcion">Descripción</option>
                            </select>
                        </div>
                        <div class="gallery-count" id="galleryCount">0 productos</div>
                    </div>
                </div>

                <div class="product-grid" id="galleryProducts" style="margin-top: 18px;"></div>
            </section>
        </section>
    </main>
    <script type="text/javascript" src="demo-circuit.js"></script>
</body>
</html>
